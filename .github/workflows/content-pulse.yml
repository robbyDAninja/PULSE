name: Content Pulse

# Preparation only. Schedule activation waits for inspected source coverage,
# agreed model cost/private destination and an independent missed-run check.
# Raw snapshots never enter this public repository or public Action artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check practical source and evidence boundaries
        run: python -m unittest discover -s tests -v
      - name: Fetch public source snapshot without synthesis, writes or messages
        run: python generate_content_pulse.py fetch --public-only --out "$RUNNER_TEMP/practical-pulse-sources.json"
