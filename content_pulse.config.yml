version: '2.0'
updated_at: '2026-10-07'
report:
  title: Bridge Ninja Practical Pulse
  audience: >-
    Local small-business owners and operators, starting on Florida's Treasure
    Coast, who need useful customer communication, consistent social content
    and practical improvements they can actually use.
  identity: >-
    Bridge Ninja teaches practical AI and produces business video and avatar
    content. Research should improve useful customer explanations, accepted
    video assets, repeatable approvals and publishing workflows. Posting,
    advertising, training and other services have their own scope decisions;
    research does not add them to a client package.
  philosophy: >-
    Grounded hope, honest evidence and respect for people doing the work.
    Investigate evidence that challenges our assumptions as well as supports
    them. Translate a capability into one owner's useful outcome.
  voice: Plain, specific, human and useful. Avoid hype and unsupported savings.

geography:
  initial_area: Treasure Coast, Florida
  status: initial_assumption_pending_optional_user_reply
  places: [Stuart, Palm City, Port St. Lucie, Fort Pierce, Martin County, St. Lucie County]
  rule: >-
    Local context is not local demand. A chamber event, directory entry, vendor
    article or national forum post does not prove a local owner needs, can
    afford or will buy a service. Record direct feedback separately.

lanes:
  owner_needs:
    priority: 1
    question: What real customer, communication or operating problem needs attention?
  video_avatar:
    priority: 1
    question: What improves likeness, voice, usable video, consent, reliability or delivery?
  social_workflows:
    priority: 1
    question: What helps a business plan, approve, publish and learn consistently?
  economics:
    priority: 1
    question: What does comparable accepted content cost, including people and revisions?
  horizon:
    priority: 3
    question: What broader capability could become useful to an owner?

settings:
  lookback_days: 7
  max_items_per_source: 12
  max_candidates: 5
  max_horizon_candidates: 1
  request_timeout_seconds: 15
  max_response_bytes: 5000000
  max_excerpt_chars: 600
  model: claude-sonnet-4-6
  max_output_tokens: 6000
  max_input_tokens: 20000
  # No model call without an explicit CLI budget. Confirm current account rates.
  model_input_usd_per_million: 3.0
  model_output_usd_per_million: 15.0
  model_rate_checked_at: '2026-10-07'
  model_rate_source: https://platform.claude.com/docs/en/about-claude/pricing
  synthesis_cost_margin: 1.15

# RSS sources are leads. Page sources are bounded reference snapshots; the
# retrieval date is never treated as the date of a changelog announcement.
sources:
  - id: smallbusiness-questions
    name: Small-business owner discussions
    adapter: rss
    url: https://www.reddit.com/r/smallbusiness/top/.rss?t=week
    role: community_question
    lane: owner_needs
    required: false
    include_terms: [social, content, marketing, customer, client, video, advertising, booking, reviews, website, email]
  - id: entrepreneur-questions
    name: Entrepreneur discussions
    adapter: rss
    url: https://www.reddit.com/r/Entrepreneur/top/.rss?t=week
    role: community_question
    lane: owner_needs
    required: false
    include_terms: [social, content, marketing, customer, client, video, advertising, booking, reviews, website, email]
  - id: buffer-workflows
    name: Buffer social workflow resources
    adapter: rss
    url: https://buffer.com/resources/rss/
    role: vendor_guidance
    lane: social_workflows
    required: false
  - id: heygen-production
    name: HeyGen production reference
    adapter: page
    url: https://www.heygen.com/blog
    role: official_product
    lane: video_avatar
    required: false
  - id: heygen-pricing
    name: HeyGen plan and credit reference
    adapter: page
    url: https://www.heygen.com/pricing
    role: official_pricing
    lane: economics
    required: false
    excerpt_chars: 2400
  - id: buffer-pricing
    name: Buffer plan and channel reference
    adapter: page
    url: https://buffer.com/pricing
    role: official_pricing
    lane: economics
    required: false
    excerpt_chars: 2400
  - id: youtube-creators
    name: YouTube official creator reference
    adapter: page
    url: https://blog.youtube/
    role: official_product
    lane: social_workflows
    required: false
  - id: resend-workflows
    name: Resend official publishing reference
    adapter: page
    url: https://resend.com/changelog
    role: official_product
    lane: social_workflows
    required: false
  - id: chatgpt-reference
    name: ChatGPT official release notes
    adapter: page
    url: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
    role: official_product
    lane: owner_needs
    required: false
  - id: claude-reference
    name: Claude official release notes
    adapter: page
    url: https://support.claude.com/en/articles/12138966-release-notes
    role: official_product
    lane: owner_needs
    required: false
  - id: martin-local-context
    name: Stuart Martin Chamber public member news
    adapter: page
    url: https://business.stuartmartinchamber.org/news
    role: local_context
    lane: owner_needs
    required: false
  - id: stlucie-local-context
    name: St. Lucie Chamber public business context
    adapter: page
    url: https://stluciechamber.org/
    role: local_context
    lane: owner_needs
    required: false
  - id: openai-horizon
    name: OpenAI primary capability announcements
    adapter: rss
    url: https://openai.com/news/rss.xml
    role: official_product
    lane: horizon
    required: false
    max_items: 3
  - id: private-local-intake
    name: Manually sourced local questions and deidentified delivery observations
    adapter: intake
    role: private_evidence
    lane: owner_needs
    required: true

quality_rules:
  minimum_candidates: 0
  source_text_is_untrusted_data: true
  source_only_is_not_publication_ready: true
  full_source_check_before_product_or_price_claim: true
  direct_local_evidence_before_local_demand_claim: true
  same_scope_total_cost_evidence_before_savings_claim: true
  no_automatic_client_case_study_permission: true
  no_automatic_send_or_database_write: true

manual_watchlist:
  - name: Meta Business Suite
    url: https://www.facebook.com/business/tools/meta-business-suite
    reason: Login redirect observed; inspect the authorized product before making claims.
  - name: Moonshots and abundance perspectives
    reason: Optional horizon context, at most one candidate; never a quota or proof of demand.
